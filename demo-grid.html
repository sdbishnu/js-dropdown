<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BSelect in a Bootstrap grid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
<link rel="stylesheet" href="demo-theme.css">
<style>
  body { padding: 18px 22px; }
  h5.title { margin: 0 0 14px; font-size: 16px; color: var(--demo-text); }
  .card { background: var(--demo-card); border: 1px solid var(--demo-line); border-radius: 12px; color: var(--demo-text); }
  .card-body { padding: 12px 14px; }
  .cap { display: block; margin: 0 0 4px; font-size: 11px; font-weight: 600; color: var(--demo-muted); text-transform: uppercase; letter-spacing: .04em; }
  .tests { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .tests .grp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--demo-text); }
  .tests .grp > span { color: var(--demo-muted); font-weight: 600; }
  .sw { position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 12px; margin: 0; }
  .sw input { appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 10px; background: #b9c2d0; position: relative; margin: 0; cursor: pointer; transition: background .15s; }
  .sw input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .sw input:checked { background: var(--demo-accent); }
  .sw input:checked::after { transform: translateX(14px); }
  .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--demo-line); }
  .seg button { padding: 3px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--demo-muted); font-size: 12px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--demo-card); color: var(--demo-accent); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .row > [class*="col-"] { margin-bottom: 14px; }
  /* everything in ONE line: equal columns that never wrap (the page scrolls sideways on a very narrow window) */
  .one-line { overflow: visible; padding-bottom: 6px; }
  .one-line > .col { flex: 1 1 0; min-width: 118px; padding: 0 5px; }
  .one-line .cap { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { font: 11px/1.5 Consolas, monospace; color: var(--demo-muted); margin: 6px 0 0; }
</style></head>
<body>
<h5 class="title">BSelect in a Bootstrap grid <small style="color:var(--demo-muted);font-weight:400">- all 10 side by side in one line</small></h5>

<!-- OUTSIDE TEST TOGGLES: they call bselect.apply({...}) and change every dropdown on the page -->
<div class="card mb-3"><div class="card-body">
  <span class="cap">Test toggles (outside the dropdowns)</span>
  <div class="tests">
    <label class="sw"><input type="checkbox" data-opt="settings" checked> Settings gear</label>
    <label class="sw"><input type="checkbox" data-opt="arrow" checked> Arrow</label>
    <label class="sw"><input type="checkbox" data-opt="images"> Images</label>
    <label class="sw"><input type="checkbox" data-opt="search" checked> Search box</label>
    <label class="sw"><input type="checkbox" data-opt="sort"> Sort button</label>
    <label class="sw"><input type="checkbox" data-opt="chips" > Chips (multi)</label>
    <label class="sw"><input type="checkbox" data-opt="panelDark"> Dropdown dark only</label>
    <div class="grp"><span>Button size</span><div class="seg" data-seg="size"><button data-v="sm">S</button><button data-v="md" class="on">M</button><button data-v="lg">L</button></div></div>
    <div class="grp"><span>Button shape</span><div class="seg" data-seg="shape"><button data-v="square">Square</button><button data-v="rounded" class="on">Round</button><button data-v="pill">Pill</button></div></div>
    <div class="grp"><span>Dropdown shape</span><div class="seg" data-seg="panelShape"><button data-v="" class="on">Same</button><button data-v="square">Square</button><button data-v="pill">Pill</button></div></div>
    <div class="grp"><span>Rows</span><div class="seg" data-seg="rowStyle"><button data-v="inset" class="on">Inset</button><button data-v="flat">Flat</button></div></div>
  </div>
  <pre id="log">ready</pre>
</div></div>

<div class="row flex-nowrap one-line">
  <div class="col"><span class="cap" title="Ward">Ward</span><div id="g1"></div></div>
  <div class="col"><span class="cap" title="Department (server)">Department (server)</span><div id="g2"></div></div>
  <div class="col"><span class="cap" title="Staff (multiple)">Staff (multiple)</span><div id="g3"></div></div>
  <div class="col"><span class="cap" title="Status">Status</span><div id="g4"></div></div>
  <div class="col"><span class="cap" title="Shift">Shift</span><div id="g5"></div></div>
  <div class="col"><span class="cap" title="Priority">Priority</span><div id="g6"></div></div>
  <div class="col"><span class="cap" title="Type">Type</span><div id="g7"></div></div>
  <div class="col"><span class="cap" title="Floor">Floor</span><div id="g8"></div></div>
  <div class="col"><span class="cap" title="Bed">Bed</span><div id="g9"></div></div>
  <div class="col"><span class="cap" title="Result">Result</span><div id="g10"></div></div>
</div>

<script src="dist/bselect.bundle.js"></script>
<script src="demo-theme.js"></script>
<script>
var avatar = function (c) { return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="' + c + '"/><circle cx="20" cy="15" r="7" fill="#fff"/><rect x="8" y="26" width="24" height="12" rx="6" fill="#fff"/></svg>'); };
var staff = [
  { id: 1, name: 'Asha Menon', role: 'Nurse', image: avatar('#e11d48') },
  { id: 2, name: 'Ben Carter', role: 'Doctor', image: '👨‍⚕️' },
  { id: 3, name: 'Chitra Rao', role: 'Admin' },
  { id: 4, name: 'Dev Patel', role: 'Pharmacist' },
  { id: 5, name: 'Elena Cruz', role: 'Lab', color: '#0f766e' },
  { id: 6, name: 'Farid Khan', role: 'Porter', image: '🚀' }
];
function named(first, prefix) { var a = first.map(function (n, i) { return { id: i + 1, name: n }; }); for (var i = a.length + 1; i <= 100; i++) a.push({ id: i, name: prefix + ' ' + i }); return a; }
function list(prefix, n) { var a = []; for (var i = 1; i <= n; i++) a.push({ id: i, name: prefix + ' ' + i }); return a; }
// staff: the 6 hand-made people first, then 94 generated ones (some with initials only, some with colours)
function moreStaff() { var a = staff.slice(); var roles = ['Nurse', 'Doctor', 'Admin', 'Pharmacist', 'Lab', 'Porter']; for (var i = a.length + 1; i <= 100; i++) a.push({ id: i, name: 'Staff member ' + i, role: roles[i % roles.length] }); return a; }
var common = { settings: true, arrow: true, imageField: 'image', subTextField: '', avatar: 'initials', images: false };
var all = {};
all.g1 = bselect('#g1', Object.assign({}, common, { options: list('Ward', 100), placeholder: 'Select ward' }));
all.g2 = bselect('#g2', Object.assign({}, common, { url: '/api/items', params: { total: 100 }, load: 'scroll', pageSize: 10, placeholder: 'Select department' }));
all.g3 = bselect('#g3', Object.assign({}, common, { options: moreStaff(), multiple: true, subTextField: 'role', placeholder: 'Select staff', display: 'text' }));
all.g4 = bselect('#g4', Object.assign({}, common, { options: named(['Open', 'In progress', 'Closed'], 'Status'), placeholder: 'Status' }));
all.g5 = bselect('#g5', Object.assign({}, common, { options: named(['Morning', 'Evening', 'Night'], 'Shift'), placeholder: 'Shift' }));
all.g6 = bselect('#g6', Object.assign({}, common, { options: named(['Low', 'Medium', 'High', 'Critical'], 'Priority'), placeholder: 'Priority' }));
all.g7 = bselect('#g7', Object.assign({}, common, { options: list('Type', 100), placeholder: 'Type' }));
all.g8 = bselect('#g8', Object.assign({}, common, { options: list('Floor', 100), placeholder: 'Floor' }));
all.g9 = bselect('#g9', Object.assign({}, common, { options: list('Bed', 100), placeholder: 'Bed' }));
all.g10 = bselect('#g10', Object.assign({}, common, { options: named(['Pass', 'Fail', 'Pending'], 'Result'), placeholder: 'Result' }));

// ---- outside toggles
var logEl = document.getElementById('log');
function say(text) { logEl.textContent = text; }
[].forEach.call(document.querySelectorAll('input[data-opt]'), function (box) {
  box.addEventListener('change', function () {
    var key = box.getAttribute('data-opt');
    if (key === 'chips') {
      all.g3._setting('display', box.checked ? 'chips' : 'text');
      say('chips = ' + box.checked + '  (staff dropdown)');
      return;
    }
    if (key === 'panelDark') { bselect.apply({ panelMode: box.checked ? 'dark' : '' }); say('panelMode = ' + (box.checked ? 'dark' : 'same') + '  (dropdown only)'); return; }
    var change = {}; change[key] = box.checked; bselect.apply(change);
    say(key + ' = ' + box.checked + '  (all dropdowns)');
  });
});
[].forEach.call(document.querySelectorAll('.seg'), function (seg) {
  seg.addEventListener('click', function (event) {
    var b = event.target.closest('button'); if (!b) return;
    [].forEach.call(seg.children, function (x) { x.classList.toggle('on', x === b); });
    var change = {}; change[seg.getAttribute('data-seg')] = b.getAttribute('data-v'); bselect.apply(change);
    say(seg.getAttribute('data-seg') + ' = ' + b.getAttribute('data-v'));
  });
});
</script></body></html>
