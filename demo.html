<!doctype html>
<html><head><meta charset="utf-8"><title>BSelect demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="demo-theme.css">
<style>body{padding:30px;max-width:420px}label{display:block;margin:18px 0 4px;font-size:13px}</style></head>
<body>
<label>1. Single (JS)</label><select id="a"></select>
<label>2. Multiple + sort + settings gear + persist</label><div id="b"></div>
<label>3. Pure HTML</label>
<div data-bselect data-multiple data-placeholder="Pick fruits" data-name="fruits"
     data-options="fruits"></div>
<script src="dist/bselect.bundle.js"></script>
<script src="demo-theme.js"></script>
<script>
// 100 options for every dropdown
var data = [];
var longName = 'A very long ward name that overflows the trigger box for sure';
for (var i = 1; i <= 100; i++) data.push({ id: i, name: i === 4 ? longName : 'Ward ' + i });
var fruits = [];
['Apple','Mango','Banana','Orange','Grape','Papaya','Guava','Lemon','Peach','Plum'].forEach(function (n, k) { for (var j = 0; j < 10; j++) fruits.push({ id: k * 10 + j + 1, name: j ? n + ' ' + (j + 1) : n }); });
bselect.data('fruits', fruits);
bselect('#a', { options: data, placeholder: 'Select ward' });
window.b = bselect('#b', { options: data, multiple: true, sort: true, settings: true, persist: 'demo-b' });
</script></body></html>
