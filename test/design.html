<!doctype html>
<html><head><meta charset="utf-8"><title>BSelect design tests</title>
<style>body{font-family:Arial;padding:20px;margin:0;display:grid;grid-template-columns:repeat(3,300px);gap:14px 30px;align-items:start}.cell{min-height:60px}.cell h5{margin:0 0 6px;font-size:11px;color:#667}.dk{background:#12161e;padding:10px;border-radius:8px}.dk h5{color:#99a}</style></head>
<body>
<div class="cell"><h5>light single, images</h5><div id="a"></div></div>
<div class="cell dk"><h5>dark multi chips</h5><div id="b"></div></div>
<div class="cell dk"><h5>dark single images + sub</h5><div id="c"></div></div>
<div class="cell"><h5>palette paper</h5><div id="d"></div></div>
<div class="cell"><h5>custom bg #0f2a44</h5><div id="e"></div></div>
<div class="cell dk"><h5>dark settings gear</h5><div id="f"></div></div>
<div class="cell"><h5>light settings gear</h5><div id="g"></div></div>
<div class="cell dk"><h5>dark server scroll</h5><div id="h"></div></div>
<div class="cell"><h5>broken image + imageMap + editor</h5><div id="i"></div></div>
<script src="../dist/bselect.bundle.js"></script>
<script>
var svg = function (c) { return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="' + c + '"/><circle cx="20" cy="15" r="7" fill="#fff"/><rect x="8" y="26" width="24" height="12" rx="6" fill="#fff"/></svg>'); };
var people = [
  { id: 1, name: 'Asha Menon', role: 'Nurse', image: svg('#e11d48') },
  { id: 2, name: 'Ben Carter', role: 'Doctor', image: '👨‍⚕️' },
  { id: 3, name: 'Chitra Rao', role: 'Admin', image: 'fa fa-user' },
  { id: 4, name: 'Dev Patel', role: 'Pharmacist' },
  { id: 5, name: 'Elena Cruz', role: 'Lab', color: '#0f766e' },
  { id: 6, name: 'Farid', role: 'Porter', image: '🚀' }
];
bselect('#a', { options: people, imageField: 'image', colorField: 'color', subTextField: 'role', avatar: 'initials', value: 1 });
bselect('#b', { options: people, multiple: true, display: 'chips', mode: 'dark', imageField: 'image', avatar: 'initials', value: [1, 2, 4], maxChips: 3 });
bselect('#c', { options: people, mode: 'dark', imageField: 'image', subTextField: 'role', avatar: 'initials', imageShape: 'rounded', value: 5 });
bselect('#d', { options: people, palette: 'paper', images: true, value: 4 });
bselect('#e', { options: people, background: '#0f2a44', images: true, imageShape: 'square', multiple: true, value: [1, 3] });
bselect('#f', { options: people, mode: 'dark', settingsButton: true, multiple: true, images: true, value: [1] });
bselect('#g', { options: people, settingsButton: true, images: true, value: 2 });
bselect('#i', { options: [{ id: 1, name: 'Broken Image', image: '/nope/missing.png' }, { id: 2, name: 'Plain Name' }, { id: 3, name: 'Mapped One' }], imageField: 'image', avatar: 'initials', imageMap: { 3: '\ud83c\udf4e' }, settingsButton: true });
bselect('#h', { url: '/api/items', load: 'scroll', pageSize: 10, mode: 'dark', images: true, avatar: 'initials', multiple: true });
</script></body></html>
