<!doctype html><html><head><meta charset="utf-8"><title>count</title><link rel="stylesheet" href="../dist/bselect.css"></head>
<body style="padding:30px;width:380px;font-family:system-ui"><select id="a"></select><br><br><select id="b"></select><br><br><select id="c"></select>
<script src="../dist/bselect.bundle.js"></script>
<script>
var opts=[];for(var i=1;i<=100;i++)opts.push({id:i,name:'Item '+i});
bselect('#a',{options:opts,multiple:true,info:true});
bselect('#b',{options:opts,info:true,infoPlace:'bottom',infoAlign:'left'});
bselect('#c',{options:opts});
</script></body></html>
